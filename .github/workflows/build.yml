Name: Server Dashboard
Summary: WebView companion app for the Northstar Labs self-hosted server dashboard
Description: |
  A lightweight WebView wrapper for the Northstar Labs self-hosted server
  dashboard. Displays live server stats, Docker container status, VM metrics,
  and service health checks from your home lab infrastructure.

  Requires a running instance of the Northstar Labs Server Dashboard on your
  local network or accessible via a domain.

  Features:
  - Full-screen WebView with hardware-accelerated rendering
  - Supports both HTTP and HTTPS dashboard URLs
  - Network state awareness
  - Automatic screen orientation support

RepoType: git
