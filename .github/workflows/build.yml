name: Build & Deploy Server Dashboard Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Locate and rename APK
        run: |
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          VERSION=$(grep "versionName" app/build.gradle | grep -oP '"\K[^"]+' | head -1)
          VCODE=$(grep "versionCode" app/build.gradle | grep -oP "[0-9]+" | head -1)
          DEST="com.sidscri.serverdashboardviewer_${VCODE}.apk"
          cp "$APK_SRC" "$DEST"
          echo "APK_PATH=$DEST" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VCODE=$VCODE" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-dashboard-viewer-${{ env.VERSION }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Deploy APK to F-Droid repo
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          source: "${{ env.APK_PATH }}"
          target: "${{ secrets.FDROID_REPO_PATH }}"

      - name: Deploy metadata to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          source: "fdroid/metadata/*"
          target: "${{ secrets.FDROID_META_PATH }}"
          strip_components: 2

      - name: Run fdroid update on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            cd ${{ secrets.FDROID_ROOT_PATH }}
            fdroid update --pretty --delete-unknown
            echo "F-Droid index updated — com.sidscri.serverdashboardviewer v${{ env.VERSION }} (code ${{ env.VCODE }})"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          name: "Server Dashboard Viewer v${{ env.VERSION }}"
